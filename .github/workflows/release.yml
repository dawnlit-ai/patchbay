# A stable release. Push a tag naming the version package.json holds
# (`git tag v0.2.0 && git push origin v0.2.0`), and every platform is built into a
# draft release. Publishing that draft on GitHub is what sends it to copies on the
# Stable channel.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'dawnlit-ai/patchbay'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $version. Tag the commit that sets the version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Draft the release
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Patchbay ${{ steps.version.outputs.version }}" --generate-notes

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ github.ref_name }}
    secrets: inherit

  discard:
    # The draft goes; the tag is yours, and stays.
    needs: [prepare, build]
    if: failure() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release delete "$GITHUB_REF_NAME" --yes
